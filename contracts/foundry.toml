[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
  "permit2/=lib/permit2/",
  "forge-std/=lib/forge-std/src/",
  "solmate/=lib/permit2/lib/solmate/",
]
